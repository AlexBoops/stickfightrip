<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity WebGL Test</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #ddd;
        font-family: monospace;
        z-index: 999;
      }
      .track {
        width: min(300px, 80vw);
        height: 8px;
        background: #222;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 12px;
      }
      .fill {
        width: 0%;
        height: 100%;
        background: #00ff7f;
        transition: width 0.15s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="status">Loading engine...</div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script>
      const statusEl = document.querySelector("#status");
      const fillEl = document.querySelector("#fill");
      const canvasEl = document.querySelector("#unity-canvas");
      const overlayEl = document.querySelector("#loading-overlay");

      const config = {
        dataUrl: "stick-asset__6n5sjn.data.unityweb",
        frameworkUrl: "stick-asset__d840jo.framework.js.unityweb",
        codeUrl: "stick-asset__ypxuas.wasm.unityweb",
        companyName: "DefaultCompany",
        productName: "Game",
        productVersion: "1.0",
      };

      const loaderScript = document.createElement("script");
      loaderScript.src = "stick-asset.loader.js";
      loaderScript.onload = () => {
        createUnityInstance(canvasEl, config, (progress) => {
          fillEl.style.width = `${Math.round(progress * 100)}%`;
          statusEl.textContent = `Loading: ${Math.round(progress * 100)}%`;
        }).then(() => {
          overlayEl.remove();
        }).catch((err) => {
          statusEl.textContent = "Engine crashed on startup.";
          console.error(err);
        });
      };
      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
